name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ملفات قديمة/ميّتة لا يحذفها نسخ الـzip؛ تُحذف هنا وتُثبَّت إزالتها في آخر الـjob
      - name: Remove obsolete files
        run: |
          rm -rf src/components/focus src/components/forest3d \
            src/store/useFocus.ts src/lib/focusStats.ts \
            "src/app/(tabs)/docs.tsx" MERGE-AR.md

      # بيانات المصحف المولَّدة تُحفظ بين البناءات: نجاح توليد واحد يكفي ولا نعتمد على الشبكة كل مرة
      - name: Cache Quran data
        uses: actions/cache@v4
        with:
          path: src/data
          key: quran-data-v1

      - name: Install dependencies
        run: |
          npm install
          # المكتبات الأصلية الجديدة تُثبَّت بالإصدار المناسب لـ SDK الحالي
          npx expo install expo-audio expo-camera expo-location expo-secure-store
          npx expo install --fix

      - name: Verify embedded Quran
        run: |
          node -e "const t=require('./src/data/quran-text.json'); if(!t.ok||Object.keys(t.pages).length!==604){console.error('Quran data missing'); process.exit(1)} console.log('Quran OK')"

      # اختبارات منطق المالية (توزيع الدفعات، الخصم، الاسترداد): أخطاؤها أرقام حقيقية
      - name: Finance tests
        run: npx --yes tsx scripts/test-finance.ts

      # أخطاء قاتلة فقط (تعريف مكرّر/اسم غير معرّف): تظهر هنا بدل فشل Metro
      - name: Check types (fatal only)
        run: bash scripts/check-types.sh

      # يكشف أخطاء كود JavaScript خلال دقيقة، قبل بناء أندرويد الطويل
      - name: Check JS bundle
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      # تثبيت NDK وCMake صراحةً: التنزيل التلقائي داخل Gradle يفشل أحيانًا على أجهزة GitHub
      - name: Install Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.1.12297006" "cmake;3.22.1" "platform-tools"

      - name: Gradle memory settings
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DoctorPlanner-apk
          path: android/app/build/outputs/apk/release/*.apk

      # بعد نجاح البناء فقط: تثبيت حذف الملفات القديمة وحفظ package-lock عند غيابه
      - name: Cleanup repo
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r -q --ignore-unmatch dp-main \
            src/components/focus src/components/forest3d \
            src/store/useFocus.ts src/lib/focusStats.ts \
            "src/app/(tabs)/docs.tsx" MERGE-AR.md
          rm -rf dp-main
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && [ -f package-lock.json ]; then
            git add package.json package-lock.json
          fi
          if ! git diff --cached --quiet; then
            git commit -q -m "chore: remove obsolete files, pin lockfile [skip ci]"
            git pull --rebase --autostash -X theirs origin main || git rebase --abort
            git push origin HEAD:main
          fi
