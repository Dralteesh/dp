name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npx expo install --fix

      # يكشف أخطاء كود JavaScript خلال دقيقة، قبل بناء أندرويد الطويل
      - name: Check JS bundle
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      # تثبيت NDK صراحةً: التنزيل التلقائي داخل Gradle يفشل أحيانًا على أجهزة GitHub
      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.1.12297006"

      - name: Gradle memory settings
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DoctorPlanner-apk
          path: android/app/build/outputs/apk/release/*.apk

      # بعد نجاح البناء فقط: حذف مجلد dp-main المتداخل من المستودع (نسخ قديمة)
      - name: Cleanup nested dp-main folder
        if: success() && github.ref == 'refs/heads/main'
        run: |
          if [ -d dp-main ] || git ls-files --error-unmatch dp-main >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -r -q --ignore-unmatch dp-main
            rm -rf dp-main
            if ! git diff --cached --quiet; then
              git commit -q -m "chore: remove nested dp-main folder [skip ci]"
              git pull --rebase -X theirs origin main || git rebase --abort
              git push origin HEAD:main
            fi
          fi
